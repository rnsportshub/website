name: Supabase Keep-Alive

on:
  schedule:
    # 03:00 UTC on days 1,5,9,...,29 of each month (never more than 4 days apart)
    - cron: "0 3 1,5,9,13,17,21,25,29 * *"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Supabase database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY repository secret"; exit 1
          fi
          status=$(curl -s -o response.json -w "%{http_code}" \
            --retry 3 --retry-delay 5 --max-time 30 \
            "${SUPABASE_URL}/rest/v1/keepalive?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "HTTP ${status}"
          cat response.json; echo
          if [ "$status" != "200" ]; then
            echo "Keep-alive ping failed"; exit 1
          fi
